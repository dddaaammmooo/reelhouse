name: Secret scan

# Catches API keys, Plex tokens and other credentials before they land on main.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
