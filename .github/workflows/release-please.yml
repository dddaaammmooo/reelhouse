name: Release Please

# Conventional commits on main (feat:, fix:, feat!:) keep a release PR up to date with the next version
# and CHANGELOG.md. Merging that PR tags vX.Y.Z, creates the GitHub release, bumps package.json and the
# version in config.xml, and attaches the app files as a zip (unsigned: TV packages need the owner's
# Samsung certificate, so build-tv.ps1 signs them locally).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the app files
        run: |
          name="reelhouse-${{ needs.release-please.outputs.tag_name }}"
          mkdir -p "dist/$name"
          cp -r config.xml index.html icon.png css js "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.zip --clobber
