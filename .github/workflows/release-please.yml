name: Release Please

# Conventional commits on main (feat:, fix:, feat!:) keep a release PR up to date with the next version
# and CHANGELOG.md. Merging that PR tags vX.Y.Z, creates the GitHub release, bumps package.json and the
# version in config.xml, and attaches the app files as a zip plus a signed TV package (tv-package.yml, signed
# with the owner's Samsung certificate from repository secrets; it carries no API keys).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zip the app files
        run: |
          name="reelhouse-${{ needs.release-please.outputs.tag_name }}"
          mkdir -p "dist/$name"
          cp -r config.xml index.html icon.png css js "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.zip --clobber

  # The signed TV package (.wgt), built with the owner's Samsung certificate from repository secrets.
  tv-package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/tv-package.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
