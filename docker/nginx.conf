server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated at container start from environment variables (see docker/10-medialoader-config.sh)
    location = /js/config.js {
        alias /etc/medialoader/config.js;
        add_header Cache-Control "no-store";
    }

    # "New releases" feeds that don't send CORS headers. The TV app calls them directly (Tizen apps
    # aren't bound by CORS); a desktop browser can't, so it goes through these proxies instead.
    # Variables + resolver = hostnames are looked up per request, so nginx starts even when offline.
    # Docker's built-in DNS only: listing an unreachable server made some lookups wait 30s.
    resolver 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    location /feeds/radarr/ {
        set $radarr_lists https://api.radarr.video;
        rewrite ^/feeds/radarr/(.*)$ /$1 break;
        proxy_pass $radarr_lists;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host api.radarr.video;
    }

    location /feeds/apple/ {
        set $apple_rss https://rss.marketingtools.apple.com;
        rewrite ^/feeds/apple/(.*)$ /$1 break;
        proxy_pass $apple_rss;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host rss.marketingtools.apple.com;
    }

    location /feeds/deezer/ {
        set $deezer https://api.deezer.com;
        rewrite ^/feeds/deezer/(.*)$ /$1 break;
        proxy_pass $deezer;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host api.deezer.com;
    }

    # Always serve fresh files while testing
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
